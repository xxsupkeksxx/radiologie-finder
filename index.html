 der DL planen und zeitgleich den US blockieren.\n(findet im DL Raum statt, der US wird jedoch ebenfalls benötigt und in den Raum gebracht, deshalb darf der US nicht anderweitig verplant werden)\n• Blutverdünner nach Blutverdünnerliste absetzen, aktuellen Quick-Wert verlangen\n• Pat. muss NICHT nüchtern beliben, kleines Frühstück und Medis sind erlaubt\n• Bett auf der TK für 1h reservieren und Anmelden. Für den Eintritt Pat 30min vor dem Termin bestellen\n• Anmeldung für die TK machen und an Pat Dispo mailen, leistungen.radiologie.zuerich@hirslanden.ch ins cc\n• Fall in den amb + Fall umhängen, sofern man geschult ist","devices":{"HI":"(ev Dudeck der IRZ?)","IP":"x"},"origin":"Interventionen","excelrow":7,"sectionNotes":""},{"id":204,"name":"PICC-Line","mod":"Intervention","section":"","pool":"SSIEBE\nKMARTI","prep":"30 min","duration":"60 - 120 min","notes":"HI: Anmeldung weiterleiten an IRZ: irz@hirslanden.ch\n\nIP:\nBei Dr. Siebert oder Dr. Martini planen in der DL!\n-> Stationär: einfach Eintragen und die Tagesverantwortung MTR Informieren 044 209 21 06\n-> Ambulant: zuerst die Anmeldung verlangen, kein Bleistifttermin abmachen. -> Visieren lassen  Gemäss Dr. Sibert barucht er kein TK Bett/kein Quick-Wert und BV spielt keine Rolle.                   Bei Dr. Martini bitte zuerst abklären ob sie TK Bett/ Quick und BV braucht.","devices":{"IP":"x"},"origin":"Interventionen","excelrow":8,"sectionNotes":""},{"id":205,"name":"Lumbalpunktion NEUROHI","mod":"Intervention","section":"","pool":"NEUROHI","prep":"45 min","duration":"90min","notes":"Ambulant + Fall!\n\n• Immer zuerst die Verordnung verlangen                                                                                               \n• Immer nach Vorbilder fragen, falls vorhanden zwingend notwendig.\n• Thrombo und Quick Werte vom Zuweiser verlangen, dürfen nicht älter als 2-3 Tage sein\n• Blutverdünner absetzen, Rücksprache mit NEUROHI Radiologen\n• Pat. 4h nüchtern\n• Pat. zuerst an Hauptempfang für TK-Check-In - danach zu uns an den Empfang für Untersuchung\n• Frühestens ab 09:00 Uhr einplanen, findet in der Durchleuchtung statt. Wenn möglich so das dansch gleich Mittagszeit ist. Ansonsten darf keine Arthro danach stattfinde, bitte dann ein belegt rein machen.\n• Aufenthalt in der Tagesklinik danach max. 1.5h\n• Pat darf danach nicht Autofahren, also nicht selbstständig mit dem Auto kommen\n• Praxis muss dem Patienten die Röhrchen und das Laborblatt ausgefüllt mitgeben, bitte Praxis kurz anrufen und fragen, ob Patient alles mitbringt.\n• Sollte die Praxis keine Röhrchen haben, bitte fragen an welches Labor die Probe geschickt werden soll und mit Sandra Salomon FV DL besprechen, ob wir Röhrchen für das gewünschte Labor haben. \n• Das Laborblatt muss aber der Zuweiser immer selber ausfüllen und dem Patienten mitgeben.\n• Bitte einen Orangen Zettel, Röhrchen bestellt bei PX XY und welches Labor, evtl. noch wann röhrchen bei uns ankommen.\n• Falls die Praxis uns die Röhrchen zusendet; Anschrift: Klinik Hirslanden - Radiologie / Durchleuchtung\n• Das Laborblatt der Analytica wird vom Zuweiser immer selber ans Labor geschickt.\n• Eintrag im Terminkalender Outlook vom Neuroradiologen machen.\n• Anmeldung für die TK machen und an Pat Dispo mailen, leistungen.radiologie.zuerich@hirslanden.ch ins cc\n• Fall in den amb + Fall umhängen, sofern man geschult ist","devices":{"HI":"x"},"origin":"Interventionen","excelrow":9,"sectionNotes":""},{"id":206,"name":"Lumbalpunktion ORLNEUROZH","mod":"Intervention","section":"","pool":"ORLNEUROZH","prep":"30 min","duration":"60 min","notes":"Ambulant + Fall!\n\n• Immer zuerst die Verordnung verlangen, keine Bleistifttermine auf telefonische Anfrage vergeben\n• Bitte auch immer mit Leitung Tel. 2106 Rücksprache nehmen bevor es geplant wird                                \n• Thrombo und Quick Werte vom Zuweiser verlangen\n• Blutverdünner absetzen gemäss Blutverdünnerliste\n• Frühestens ab 09:00 Uhr einplanen, findet in der Durchleuchtung st -einleitung","duration":"30min - \n120 min - \n30 min","notes":"• Immer zuerst die Anmeldung verlangen, keine Bleistifttermine auf Telefonische Anfrage vergeben\n• HI: Anmeldung weiterleiten an Mikrotherapie / Prof. Dudeck und Prof. Szabo. Diese werden die Intervention bei uns in der DL durchführen aber die Planung obliegt dem Sekretariat der Mikrotherapie.\n\nSTATIONÄRER FALL! Patientendispo bei Planung miteinbeziehen, selbe Anmeldung wie bei Ambulant + Fällen\nBitte Versicherungsstatus vom Pat abklären, in der IP können nur Private und Halbrpivate stationär liegen, wenn allgemeinversichert, Pat fragen, ob er die zusätzlichen Kosten übernimmt\n• IP: Bei Dr. Siebert planen, bitte vorgängig mit ihm besprechen/auch mit Leitung 2106 Rücksprache halten (Achtung: Es können nur zwei MTR diesen Eingriff. DEr Termin uss ZWINGEND vor Planung mit der Leitung besprochen werden)\n• Es muss eine stationäre Übernachtung eingebucht werden + die Intervention findet unter Vollnarkose statt. Terminkoordination über die Patientendispo der Klinik im Park (044 209 21 60)\n• Dauer des Termins (Gerät siehe im Titel): 30min als \"Belegt\" eintragen, Start Einleitung der Anästhesie (der Patientendispo klar kommunizieren dass diese Uhrzeit Start der Anästhesieeinleitung ist) - Termin im CT oder DL 2h, (bitte Dauer noch von Dr. Siebert bestätigen lassen) - Am Ende nochmals 30min als Belegt blocken, für die Aufräumarbeiten.\n\n• Patientenaufgebot: Pat muss auch bei diesen Interventionen mindestens 24h vor dem Termin ein Aufklärungsgespräch mit Dr. Siebert vor Ort haben. Hierfür einen ambulanten RadiologieFall eröffnen mit Massnahme \"Vorbesprechung\", im TRM ein belegt eintragen mit Patientenressource und Text \"Aufklärungsgespräch bei Stefan Siebert) - Dauer für Vorbesprechungstermin: 30min, Termin Dr. Siebert im Outlook-Kalender schicken.\n• Für den Tag der Intervention folgende Aufklärung: Aufgrund der Vollnarkose muss Pat komplett nüchtern sein ab 00:00 Uhr Nachts, auch kein Wasser. Stationäre Eintrittszeit 3h vor Start (DISPO öffnet um 06:00 Uhr Morgens, bei früheren Termine ist die Vorlaufs-Zeit auf 2.5h kürzbar), dann findet in dieser Zeit noch das Aufklärungsgespräch der Anästhesie statt.\n• Pat wird dann über Nacht bleiben.\n• TK Anmeldung für stationäre Übernachtung ausfüllen,an Pat Dispo mailen, leistungen.radiologie.zuerich@hirslanden.ch ins cc\n• Fall in den stationären Fall umhängen, sofern man geschult ist","devices":{"IP":"x"},"origin":"Interventionen","excelrow":17,"sectionNotes":""},{"id":214,"name":"Prostata-Biopsie MR-gesteuert","mod":"Intervention","section":"","pool":"ABDURO","prep":"20 min","duration":"30 min","notes":"Immer zuerst die Anmeldung verlangen, keine Termine auf telefonische Anfrage vergeben\n• Vorbilder vorhanden? Wenn nein bestellen. Wichtig: Es darf nicht älter als 6 Monate sein, falls älter, bitte den Radiologen fragen (Dr. O Donati. Dr. C. Karlo oder Prof. P. Stolzmann machen diese Biopsien) \n• Anmeldung verschmelzen und Radiologen zum visieren geben\n\nNotwendiges Material für die Durchführung der Biopsie (Bitte vorgängig mit Barbara Raschle 2646 besprechen ob Material vorhanden):\nBiopsienadel / Needleguide  müssen vorhanden sein– Info: seit Corona ist die Beschaffung der Needleguides problematisch. Wenn keine vorhanden sind, kann es bis zu mehreren Monaten dauern bis wieder eine Lieferung Eintrifft. Patienten und Zuweiser/in müssen in diesem Fall direkt darüber informiert werden.\n\n\nPlanung\n\n• Falls Blutverdünner, diesen anhand der Blutverdünnerliste absetzen lassen\n• Patienten müssen als Prophylaxe das Antibiotika  Ciproxin 500mg 10 Tabletten nehmen, das Rezept oder Medikament müssen Sie beim Zuweiser oder Hausarzt abholen (Bitte genug Zeit vorher planen, damit der Patient das Antibiotika organisieren kann). Sollte der Patient ein anderes Antibiotika wünschen, kann er das nach Rücksprache mit seinem Arzt gern nehmen.\n• Die Einnahme des Medikaments muss am Abend vor der Untersuchung mit einer Tablette gestartet werden. Danach muss er immer morgens und abends eine Tablette nehmen, bis die Packung aufgebraucht ist (steht alles im Merkblatt Prostatabiopsie)\n• In den für die MRI gesteuerte Prostatabiopsie Slots im Skyra planen (dunkelblau, jeweils DI oder FR, falls anderer Tag gewünscht nur nach Absprache mit AL)\n• Prostatabiopsie Merkblatt/Aufklärungsprotokoll dem Patienten nach Hause schicken","devices":{"HI":"x"},"origin":"Interventionen","excelrow":18,"sectionNotes":""},{"id":215,"name":"PRP Infiltrationen","mod":"Intervention","section":"","pool":"Dr. Fischer","prep":"","duration":"","notes":"• Wird immer durch Dr. Kessler Oliver angemeldet\n• Wenn Anmeldung kommt bitte immer dierkt an Bianca Gilly und Michael Fischer per Mail weiterleiten, sie planen alles selbst.\nAuf der Anmeldung steht in der Regel PRP, falls nicht kann man immer Bianca Gilly anrufen und nachfragen. Bitte die Anleitung im Inside anschauen, es braucht nun zwei Fälle (wird durch Bianca eröffnet).","devices":{"HI":"x"},"origin":"Interventionen","excelrow":19,"sectionNotes":""},{"id":216,"name":"Markereinlage\n(nur in KIP bei Dr. Siebert)","mod":"Intervention","section":"","pool":"SSIEBE","prep":"15 min","duration":"60 min","notes":"wird wie CT Interventionen geplant, jedoch 60 min                                                                                   \nBitte Termin immer der Radiotherapie (2550) angeben sobald vereinbart wurde","devices":{"IP":"x"},"origin":"Interventionen","excelrow":20,"sectionNotes":""},{"id":217,"name":"Schilddrüsen-Ablation\n(wird über IRZ angemeldet)","mod":"Intervention","section":"","pool":"IRZ-Ärzte","prep":"15 min","duration":"90 min","notes":"• NEXUS-Massnahme Überbegriff: US Interventionen\n• Terminkoordination: IRZ koordiniert den Termin und informiert die Patient*nnen\n• Fallart: Stationärer Fall (Patienten treten circa 1.5h vorher ein und bleiben nach der Intervention eine Nacht\n• Untersuchungszeit: 90 Minuten\n• Vorbereitungszeit: 15 Minuten (nicht relevant, da die Patienten alle stationär sind)","devices":{"HI":"x"},"origin":"Interventionen","excelrow":21,"sectionNotes":""},{"id":218,"name":"Sonstige Interventionen\n(z. Bsp. Katheterwechsel, PTCD, Chemoembolisationen, Angios)","mod":"Intervention","section":"","pool":"","prep":"","duration":"","notes":"Das sind teilweise sehr komplexe und lange Eingriffe, die meist auch spezielles Material benötigen, was eine Vorlaufzeit beim Bestellen braucht. \nEs ist daher zwingend notwendig, dass jeder Eingriff, der nicht in eurer Liste steht, vor der Planung mit der Leitung besprochen wird – unabhängig von den Planungsanweisungen von Stefan Siebert!\n\nWenn eine spezielle Intervention angefordert wird, meldet ihr euch direkt auf 2106 mit den genauen Angaben – wir besprechen dann alles mit Stefan Siebert und geben euch die genauen Planungsanweisungen durch.","devices":{"IP":"x"},"origin":"Interventionen","excelrow":22,"sectionNotes":""},{"id":219,"name":"Ultraschall-gesteuert\n(Stanzbiopsie)","mod":"Mamma-Intervention","section":"","pool":"MAMMAZH","prep":"keine","duration":"45 min","notes":"• Immer zuerst die Anmeldung verlangen, keine Termine auf telefonische Anfrage vergeben\n\n• Vorbilder vorhanden? Wenn nein bestellen\n• Anmeldung verschmelzen, omomalint zus. aufnehmen und Radiologin zum visieren geben (prüfung ob tatsächlich US-gesteuert oder andere vorgehensweise erwünscht)\n• Blutverdünner nach Blutverdünnerliste absetzen\n• Patientin sollte die nächsten 3-4 Tage keine schweren Gegenstände heben!\n\n• Empfang: Formulare zum Abgeben: Datenschutz Formular und EIN_Biopsie_Punktion Fragebogen aus dem Nexus-Schnelldruck\n\nIn der HI an den Wochentagen MO und MI planen\nIn der IP an den Wochentagen DI und DO planen - bitte parallel keine Mamma-Sono planen = US sperren!!!\n\nPD Dr. med. Konstantin Dedes in der KIP\nDr. Dedes schickt gelegentlich Anmeldungen für Ultraschallgesteuerte Vakuumbiopsien, meistens für einen Freitag. Diese dürfen ohne RS mit Nadja Mamisch und Julia Rabanser einfach im Ultraschall eingeschrieben werden. Dr. Dedes benötigt leidglich unsere Gerätschaften und macht den Eingriff selber. Wir stellen ihm ebenfalls kein Assistenz-Personal – er kennt diese Vereinbarung. Dr. Dedes benötigt für den Eingriff 30min – ihr könnt die Massnahme entsprechend so anlegen. Bitte direkt Dr. Dedes bei durchführendem Arzt eingeben.\n\nBitte beachtet, dass diese Vereinbarung nur mit Dr. Dedes gemacht wurde – sollte ein anderer Arzt der ZW sein muss die Massnahme normal über Nadja/Octorad und Julia Rabanser geplant werden.","devices":{"HI":"x","IP":"x"},"origin":"Mamma Interventionen","excelrow":4,"sectionNotes":""},{"id":220,"name":"Mammographie-gesteuert \nAuch genannt: Stereotaxie / stereotaktische Biopsie\n(Vakuumbiopsie)","mod":"Mamma-Intervention","section":"","pool":"ZHNMAMIS","prep":"keine","duration":"60 min","notes":"• Immer zuerst die Anmeldung verlangen, keine Termine auf telefonische Anfrage vergeben\n• Vorbilder vorhanden? Wenn nein bestellen. Wichtig: Es muss sich um eine aktuelle Mammographie handeln. US Mamma oder MR Mamma ersetzen dies nicht, sind zusätzlich aber natürlich auch hilfreich falls vorhanden. (Bei externen Bildern Aktenstudium abrechnen an einem anderen Tag als Vorbesprechung oder dem Eingriffstag)\n• Anmeldung verschmelzen und Radiologin zum visieren geben (Prüfung ob tatsächlich MG-gesteuert oder andere Vorgehensweise erwünscht) -> Bitte direkt Nadja Mamisch im Pool eintragen\n• 3 Termine sind Notwendig. (somit auch 3 Fälle) Vorbesprechung - Biopsie (siehe omom-Liste unten) - Nachsorge (zus. omomcst)\n\nIm Fall von der Biopsie folgende Leistungen aufnehmen: \t\n• Rx Präparateradiographie (in der Mammographie) (mgmaop)\n• Ärztliche Leistung bei Intervention (omomalint)\n• Spezialverband (neutrale Leistung) (omomspb)\n• Nichtärztliche Betreuung nach Eingriff mit Lokalanästhesie/Narkose (omominmmint)\n\nTermin / Fall Nr. 1:\n• Aufklärungsgespräch. \nDieses muss mind. 24h vor dem Biopsie-Termin vor Ort stattfinden (es darf mehr als 24h früher geplant sein, jedoch nicht weniger -  Bei Rückfragen: Wir sind gesetzlich dazu verpflichtet!). Hierfür einen weiteren Fall eröffnen im SAP, die Massnahme im Nexus heisst «Vorbesprechung» und ist in den neutralen Massnahmen zu finden.\nTermin einplanen: Dauer: 30min. Plandatum und Uhrzeit in den Nexus-Fallstammdaten eintragen und auf «t» setzen. Die Massnahme erscheint nicht im TRM, deshalb im Ultraschall ein «belegt» mit Patientenressource und Text planen, damit es gesehen wird und die Senologin nicht zeitgleich einen US-Mamma durchführen muss. Bitte Vorbesprechungen erst ab 09.00 Uhr planen.\nVorgespräch nur bei Nadja Mamisch und Cäcilia Reiner planen! Immer bei jener die die Biopsie durchführt, muss nicht in der IP sein.                                                                   \nFür den Empfang gibt es ein Spezial Fragebogen welcher nicht im Nexus-Schnelldruck existiert. Er ist im Handbuch abgelegt im Ordner: 3. Merkblätter - Patienteninformation - Rezepte. Auf der Seite 3 mit dem Fragebogen und den Unterschriften muss auf der Höhe der Kopfzeile Name und Geburtsdatum der Patientin vermerkt werden. Bitte bereits vorbereiten (Versand per Mail an MA am IP Empfang mit Info der Pat (Name/Geb-Dat.), diese beschriften den Bogen und legen ihn im Pendenzfach bereit)\n\nTermin / Fall Nr. 2:\n• Biopsie - in der MG, Dauer 1h. (Dienstag vormittags)\n• der Ultraschall muss zeitgleich für Mamma-Schalle besetzt werden. Andere Ultraschalle dürfen jedoch geplant werden) \n• Falls Blutverdünner, diesen anhand der Blutverdünnerliste absetzen lassen.\n• Patientin sollte die nächsten 3-4 Tage keine schweren Gegenstände heben!\n\nEmpfang: Nur das Datenschutzformular abgeben. Biopsie-Fragebogen bereits im Aufklärungsgespräch ausgefüllt und abgelegt\n\nTermin / Fall Nr. 3:\n• Nachsorgetermin\nNeu planen wir standardmässig Nachsorgetermine für Patientinnen nach einer MR-Biopsie oder stereotaktischen\nBiopsie ein. Diese müssen immer am dienstags oder donnerstags in der Folgewoche nach dem Eingriff in der KIP eingeplant werden. Am besten bei der Radiologin planen, welche den Eingriff durchgeführt hat!\nHierfür muss die Massnahme «US Mamma» im Ultraschall terminiert werden.\n\nBitte die omom's kontrollieren!\n\nNur Dr. Nadja Mamisch und Dr. Cäcilia Reiner machen diese Biopsien - Vorgespräch nur bei Nadja Mamisch und Cäcilia Reiner planen, am besten am Tag vor Eingriff zw. 09.00-12.00 Uhr in der KIP!","devices":{"IP":"x"},"origin":"Mamma Interventionen","excelrow":5,"sectionNotes":""},{"id":221,"name":"US-gesteuerte Vakuumbiopsie durch Dr. Dedes","mod":"Mamma-Intervention","section":"","pool":"ZHNMAMIS \nZHREINER","prep":"keine","duration":"60min","notes":"Im Ultraschall einfach den gewünschten Slot von der Praxis reservieren. Dr. Dedes macht es selber!","devices":{"IP":"x"},"origin":"Mamma Interventionen","excelrow":7,"sectionNotes":""},{"id":222,"name":"MRI-gesteuert\n(Vakuumbiopsie)","mod":"Mamma-Intervention","section":"","pool":"ZHNMAMIS","prep":"45 min","duration":"60 min","notes":"• Immer zuerst die Anmeldung verlangen, keine Termine auf telefonische Anfrage vergeben\n• Vorbilder vorhanden? Wenn nein bestellen. Wichtig: Es muss sich um ein aktuelles MR Mamma handeln. US Mamma oder MG ersetzen dies nicht, sind zusätzlich aber natürlich auch hilfreich falls vorhanden. (Bei externen Bildern Aktenstudium abrechnen an einem anderen Tag als Vorbesprechung oder dem Eingriffstag)\n• Anmeldung verschmelzen (omomalintct nicht vergessen!) und Radiologin zum visieren geben (Prüfung ob tatsächlich MG-gesteuert oder andere Vorgehensweise erwünscht) -> Bitte direkt Nadja Mamisch im Pool eintragen\n• 3 Termine sind notwendig. (somit auch 3 Fälle) Vorbesprechung - Biopsie (siehe omom-Liste unten) - Nachsorge (zus. omomcst)\n\nIm Fall von der Biopsie folgende Leistungen aufnehmen: \t\n• Rx Präparateradiographie (in der Mammographie) (mgmaop)\n• Ärztliche Leistung bei Intervention (omomalint)\n• Spezialverband (neutrale Leistung) (omomspb)\n• Nichtärztliche Betreuung nach Eingriff mit Lokalanästhesie/Narkose (omominmmint)\n\nNotwendiges Material für die Durchführung der Biopsie (Bitte vorgängig mit FV MRT oder AL MTR der IP abklären ob vorhanden unter 2106):\nBiopsienadel / Visiloc / Clip (jeweils mind 2. Stück müssen vorhanden sein, damit eines als Reserve dient falls etwas mit einem der Materialien schieflaufen würde (z.B. fällt runter und ist nicht mehr Steril) – Info: seit Corona ist die Beschaffung der Visilocs problematisch. Wenn keine vorhanden sind, kann es bis zu mehreren Monaten dauern bis wieder eine Lieferung eintrifft. Patientin und Zuweiser/in müssen in diesem Fall direkt darüber informiert werden.\n\nTermin / Fall Nr. 1:\n• Aufklärungsgespräch\nDieses muss mind. 24h vor dem Biopsie-Termin vor Ort stattfinden (es darf mehr als 24h früher geplant sein, jedoch nicht weniger -  Bei Rückfragen: Wir sind gesetzlich dazu verpflichtet!). Hierfür einen weiteren Fall eröffnen im SAP, die Massnahme im Nexus heisst «Vorbesprechung» und ist in den neutralen Massnahmen zu finden.\nTermin einplanen: Dauer: 30min. Plandatum und Uhrzeit in den Nexus-Fallstammdaten eintragen und auf «t» setzen. Die Massnahme erscheint nicht im TRM, deshalb im Ultraschall ein «belegt» mit Patientenressource und Text planen, damit es gesehen wird und die Senologin nicht zeitgleich einen US-Mamma durchführen muss.\nVorgespräch nur bei Nadja Mamisch und Cäcilia Reiner planen! Immer bei jener die die Biopsie durchführt, muss nicht in der IP sein.    \nEmpfang: Spezialfragebogen aus dem Nexus-Schnelldruck abgeben: EIN_Mammabiopsie MR (Falls Französisch oder Italienisch benötigt, diese sind ebenfalls im Handbuch zu finden)\n\nTermin / Fall Nr. 2:\n• Biopsie – im MRI 1 (Philipps), Dauer 1h. nachmittags (2 Termine immer Dienstag nachmittags!)\n• Das Gerät Mammographie muss zeitgleich belegt werden, da die Mammographie-MTR an der Biopsie teilnimmt. Es sind bereits Sperrung à 90min (15min vor, 60min während und 15min nach MR Biopsie) hinterlegt. Andere Ultraschalle dürfen jedoch geplant werden, diese werden von einem anderen Radiologen durchgeführt. Falls bereits Mammographien geplant sind, Absprache mit JRA ob MTR Personal verfügbar diese durchzuführen, falls nein, diese verschieben.\n• Falls Blutverdünner, diesen anhand der Blutverdünnerliste absetzen lassen.\n• Patientin sollte die nächsten 3-4 Tage keine schweren Gegenstände heben!\n\nEmpfang: Formulare abgeben: Datenschutzblatt & Fragebogen MRI. (Biopsiefragebogen wurde bereits beim Aufklärungsgespräch ausgefüllt und abgelegt)\n\nTermin / Fall Nr. 3:\n• Nachsorgetermin\nNeu planen wir standardmässig Nachsorgetermine für Patientinnen nach einer MR-Biopsie oder stereotaktischen\nBiopsie ein. Diese müssen immer am dienstags oder donnerstags in der Folgewoche nach dem Eingriff in der KIP eingeplant werden. Am besten bei der Radiologin planen, welche den Eingriff durchgeführt hat!\nHierfür muss die Massnahme «US Mamma» im Ultraschall terminiert werden.\n\nBitte die omom's kontrollieren!\n\nNur Dr. Nadja Mamisch und Dr. Cäcilia Reiner machen diese Biopsien, immer nachschauen ob Frau Dr. Mamisch oder Frau Dr. Reiner gemäss Plan da sind. Vorgespräch nur bei Nadja Mamisch und Cäcilia Reiner planen, am besten am Tag vor Eingriff zw. 09.00-12.00 Uhr in der KIP!","devices":{"IP":"x"},"origin":"Mamma Interventionen","excelrow":8,"sectionNotes":""},{"id":223,"name":"Drahtmarkierung","mod":"Mamma-Intervention","section":"","pool":"MAMMAZH","prep":"keine","duration":"45 min","notes":"• In der Mammographie planen am Nachmittag\n• Nach Blutverdünner fragen (nach BV Liste absetzten)                                                                                          • Die Patientin geht danach sofort nach Hause","devices":{"IP":"x"},"origin":"Mamma Interventionen","excelrow":10,"sectionNotes":""}],"remote":[{"name":"MR Ganzkörper+ Ahead","yes":true,"no":false,"conditional":true,"notes":""},{"name":"MR Schädel fMRI","yes":false,"no" function displayName(r){let name=String(r.name||'').trim();let prefix='';if(r.mod==='MR')prefix='MR';else if(r.mod==='CT')prefix='CT';else if(r.mod==='Durchleuchtung')prefix='DL';else if(r.mod==='Intervention')prefix='INT';else if(r.mod==='RX / US'){prefix=/^US(?:\W|$)/i.test(name)?'US':/^DEXA(?:\W|$)/i.test(name)?'DEXA':'RX'}else if(r.mod==='Mamma-Intervention'){prefix=/^(?:US|Ultraschall)(?:\W|$)/i.test(name)?'US':/^(?:MR|MRI)(?:\W|$)/i.test(name)?'MR':/^Mammographie(?:\W|$)/i.test(name)?'MG':'MAM-INT'}
 if(prefix==='DEXA'&&/^dexa$/i.test(name))return 'DEXA';if(prefix==='MR'&&/^MRI(?=[-\s])/i.test(name))return name.replace(/^MRI/i,'MR');
 // Bereits vorhandene Modalitätskürzel nicht doppelt schreiben.
 if(prefix&&new RegExp('^'+prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\s|[-–:/]|$)','i').test(name))return name;
 return prefix?prefix+' '+name:name}
function score(r,q){if(!q)return 1;let n=norm(displayName(r)),raw=norm(r.name),m=norm(r.mod+' '+r.section),words=q.split(' ');if(n===q)return 120;if(n.startsWith(q))return 100;if(raw===q)return 90;if(n.includes(q))return 80;if(raw.startsWith(q))return 70;if(words.every(x=>n.includes(x)))return 60;if(words.every(x=>(n+' '+m).includes(x)))return 30;return 0}
function list(){let q=norm($('search').value);return DB.records.map(r=>({...r,_score:score(r,q)})).filter(r=>(filter==='Alle'||r.mod===filter)&&r._score>0).sort((a,b)=>b._score-a._score||displayName(a).localeCompare(displayName(b),'de'))}
function renderTabs(){let labels={'Durchleuchtung':'DL','Intervention':'INT','Mamma-Intervention':'Mamma-INT'};$('tabs').innerHTML=mods.map(m=>'<button class="tab '+(m===filter?'active':'')+'" data-tab="'+esc(m)+'">'+esc(labels[m]||m)+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.tab;selected=null;render()})}function checkDevice(v){let t=String(v).toLowerCase().trim();return t==='x'?'allowed': t==='a'||t==='m'||t==='(x)'||t.includes('nur')?'conditional':'other'}function findRemote(r){if(r.mod!=='MR')return null;let needle=norm(r.name);let found=DB.remote.find(x=>norm(x.name).replace(/^mr /,'')===needle);return found||null}function isIP(k){return /^(?:IP)(?:\s|·|$)/i.test(k)}
function extractPool(r){let original=String(r.pool||'').trim();let match=String(r.notes||'').match(/(?:^|\n)\s*POOL\s*:\s*([^\n]+)/i);let specified=match?match[1].trim():'';let generic=/individuell|siehe text/i.test(original);let cleaned=original.replace(/^(?:POOL\s*:?\s*)+/i,'').trim();if(generic&&specified)return {main:specified,additional:'Pool aus den Planungshinweisen übernommen',original:original};if(!cleaned){const note=String(r.notes||'').match(/(?:^|[\n/])\s*POOL\s*:\s*([^\n/]+)/i);if(note&&/^(?:ONKOZH|ORLNEUROZH|ABDUROZH|THORAXZH|MAMMAZH|MSKZH|HERZIP|RXPOOLZH|USIP)\b/i.test(note[1].trim()))return {main:note[1].trim().split(/\s+/)[0],additional:'Pool ausdrücklich aus den Planungshinweisen',original:original};let n=String(r.name||'').trim(),mod=r.mod,sec=String(r.section||'').toLowerCase();let inferred='';if(mod==='RX / US'&&/^(?:US|Ultraschall)\b/i.test(n)&&!/mamma/i.test(n))inferred='USIP';else if(mod==='RX / US'&&/^(?:RX|Telos)\b/i.test(n)&&!/mammographie/i.test(n))inferred='RXPOOLZH';else if(mod==='CT'&&['obere extremitäten','untere extremitäten'].includes(sec)&&/^(?:schulter|oberarm|ellbogen|vorderarm|unterarm|hand|finger|hüfte|oberschenkel|unterschenkel|knie|rückfuss|fuss)\b/i.test(n)&&!/arthro|prothesen|gicht|ganzbein/i.test(n)&&Object.keys(r.devices||{}).some(isIP))inferred='MSKZH';return {main:inferred||'Nicht angegeben',additional:inferred?'Ergänzung aus KIP-Poolliste (ursprünglich ohne Pool) · im Zweifelsfall prüfen':'',original:original}};let result=cleaned;
// Bei expliziter Standort-Zuordnung KIP zuerst nennen; den vollständigen Originaltext erhalten.
let locationMatch=cleaned.match(/Klinik\s+im\s+Park\s*:\s*([^\n/]+?)(?=\s*\/|$)/i);
if(locationMatch){let val=locationMatch[1].trim();result=val;return {main:result,additional:'Klinik im Park · gemäss Untersuchungsliste',original:original}}
// Bei Paaren im Schema HI / KIP die KIP-Variante sichtbar voranstellen, soweit ausdrücklich nachvollziehbar.
let two=cleaned.match(/^(?:NEUROHI|NEURHOHI|NEUROHI\s*\/\s*)\s*\/\s*(ORLNEUROZH)$/i);
if(two)return {main:two[1],additional:'Klinik im Park · weitere Poolangabe siehe Original',original:original};
if(/\bNEUROHI\s*\/\s*ORLNEUROZH\b/i.test(cleaned))return {main:'ORLNEUROZH',additional:'Klinik im Park · Zuweiserregeln im Original beachten',original:original};
return {main:result,additional:generic?'Pool abhängig von Planungshinweisen':'',original:original}}
function poolMarkup(r){let p=extractPool(r);return '<div class="pool-main">'+esc(p.main)+'</div>'+(p.additional?'<p class="explain">'+esc(p.additional)+'</p>':'')+(p.original&&norm(p.original)!==norm(p.main)?'<details class="originalpool"><summary>Vollständige Poolangabe / weitere Standorte</summary><div class="note">'+esc(p.original)+'</div></details>':'')}
function renderDetail(r){if(!r){$('detail').innerHTML='<div class="empty">Untersuchung eingeben oder aus der Liste auswählen.</div>';return}let ds=Object.entries(r.devices).sort((a,b)=>Number(isIP(b[0]))-Number(isIP(a[0]))),allowed=ds.filter(([k,v])=>checkDevice(v)==='allowed'),conditional=ds.filter(([k,v])=>checkDevice(v)!=='allowed');let deviceMarkup=ds.length?'<div class="device-list">'+allowed.map(([k,v])=>'<div class="device">✓ '+esc(k)+'</div>').join('')+conditional.map(([k,v])=>'<div class="device conditional">⚠ '+esc(k)+' · '+esc(v)+'</div>').join('')+'</div>':'<div class="warn">Für diese Untersuchung enthält die Tabelle keine vollständige Geräte-/Standortfreigabe. Angaben in den Hinweisen prüfen.</div>';let remote=findRemote(r);let remMarkup=remote?'<div class="block"><h2>Remote-Scanning</h2><div class="device-list"><div class="device '+(remote.yes?'':'no')+'">'+(remote.yes?'✓ Laut Remote-Liste: Ja':remote.no?'✕ Laut Remote-Liste: Nein':'Nicht eindeutig')+'</div>'+(remote.conditional?'<div class="device conditional">⚠ Nur wenn parallel Knie / WS nativ</div>':'')+'</div>'+(remote.notes?'<p class="explain">'+esc(remote.notes)+'</p>':'')+'</div>':'';let global=DB.meta[r.mod]||[];$('detail').innerHTML='<div class="eyebrow">'+esc(r.mod)+'</div><h1>'+esc(displayName(r))+'</h1><div class="sec">'+(r.section?'Bereich: '+esc(r.section)+' · ':'')+'Original: '+esc(r.origin)+' · Zeile '+r.excelrow+'</div><div class="metrics"><div class="metric"><div class="lab">Untersuchungsdauer</div><div class="value">'+esc(r.duration||'Nicht angegeben')+'</div></div><div class="metric"><div class="lab">Vorbereitungszeit</div><div class="value">'+esc(r.prep||'Nicht angegeben')+'</div></div></div><div class="block"><h2>Pool / Zuweiser · Klinik im Park zuerst</h2>'+poolMarkup(r)+'</div><div class="block"><h2>Geräte und Standorte · Klinik im Park zuerst</h2>'+deviceMarkup+'<p class="explain">Grün = explizit mit x markiert. Gelb = bedingt / besonderer Vermerk. Nicht aufgeführte Geräte sind in dieser Zeile nicht freigegeben oder nicht dokumentiert – nicht eigenständig als erlaubt annehmen.</p></div>'+(r.notes?'<div class="block"><h2>Wichtige Planungshinweise</h2><div class="note">'+esc(r.notes)+'</div></div>':'')+(r.sectionNotes?'<div class="block"><h2>Allgemeiner Hinweis zum Bereich</h2><div class="note">'+esc(r.sectionNotes)+'</div></div>':'')+remMarkup+(global.length?'<div class="block"><h2>Allgemeine Vorgaben · '+esc(r.mod)+'</h2><div class="note">'+global.map(x=>'• '+esc(x)).join('\n')+'</div></div>':'')+'<div class="footer">Quelle: hochgeladene Untersuchungsliste. Bei Widersprüchen oder Spezialfällen gilt die aktuelle interne Weisung und die Rücksprache mit der zuständigen Fachverantwortung. Keine Patientendaten eingeben.</div>'}function render(){renderTabs();let arr=list();$('count').textContent=arr.length+' Untersuchungen gefunden · '+DB.records.length+' insgesamt';if(!arr.some(r=>r.id===selected))selected=arr[0]?.id??null;$('results').innerHTML=arr.length?arr.slice(0,limit).map(r=>'<button class="item '+(r.id===selected?'active':'')+'" data-id="'+r.id+'"><strong>'+esc(displayName(r))+'</strong><small>'+esc(r.mod)+(r.duration?' · '+esc(r.duration):'')+'</small></button>').join('')+(arr.length>limit?'<button class="item" id="more">Weitere anzeigen …</button>':''):'<div class="empty">Keine passenden Untersuchungen gefunden.</div>';$('results').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.id);render()});if($('more'))$('more').onclick=()=>{limit+=100;render()};renderDetail(arr.find(r=>r.id===selected))}$('search').addEventListener('input',()=>{selected=null;limit=90;render()});$('clear').onclick=()=>{$('search').value='';selected=null;render();$('search').focus()};$('minibtn').onclick=()=>{document.body.classList.toggle('mini');$('minibtn').textContent=document.body.classList.contains('mini')?'Normal':'Kompakt'};document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('search')){e.preventDefault();$('search').focus()}if(e.key==='Escape'&&document.activeElement===$('search'))$('search').blur()});render();</script></body></html>
